; ClickThroughGuard
; While this skin is loaded, every Rainmeter skin is truly click-through
; whenever a fullscreen or borderless window (a game, fullscreen video)
; is in front. Unload the skin to switch it off.
;
; Settings (edit, then refresh this skin):
;   Mode    = Fullscreen  -> only while something fullscreen is in front
;             Always      -> all the time
;   Exclude = configs to leave alone, separated by |
;             e.g. Exclude=NetDot X|Mond\Settings

[Rainmeter]
Update=100
AccurateText=1

[Metadata]
Name=ClickThroughGuard
Information=Makes all skins truly click-through while a game or fullscreen window is in front.

[Variables]
Mode=Fullscreen
Exclude=

[MeasureGuard]
Measure=Plugin
Plugin=ClickThroughGuard
Mode=#Mode#
Exclude=#Exclude#

; Rainmeter needs at least one meter; this one is invisible.
[MeterDot]
Meter=Image
W=1
H=1
SolidColor=0,0,0,1
